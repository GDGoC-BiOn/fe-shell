# fe-shell (host) — served at the LB root path "/".
# Same-origin with the remotes (via the LB), so NO CORS headers are needed.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are content-addressed → cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached stale, or users pin an old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
