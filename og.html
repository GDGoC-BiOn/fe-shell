<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1100px 500px at 85% -10%, #eef3ff 0%, rgba(238,243,255,0) 60%),
          #ffffff;
        color: #191919;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .accent {
        position: absolute;
        right: -120px; top: 50%; transform: translateY(-50%);
        width: 520px; height: 520px; border-radius: 50%;
        background: conic-gradient(from 200deg, #1A73E8, #5b9bff, #1A73E8);
        filter: blur(2px); opacity: 0.12;
      }
      .top { display: flex; align-items: center; gap: 16px; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px; background: #191919;
        display: flex; align-items: center; justify-content: center;
        font-family: "Inter Tight"; font-weight: 700; color: #fff; font-size: 34px;
        position: relative;
      }
      .mark::after {
        content: ""; position: absolute; right: 8px; bottom: 8px;
        width: 9px; height: 9px; border-radius: 50%; background: #1A73E8;
      }
      .chip {
        font-weight: 500; font-size: 22px; color: #5f6368;
        border: 1px solid #e3e6ea; border-radius: 999px; padding: 8px 18px;
      }
      .hero { max-width: 900px; }
      .word {
        font-family: "Inter Tight"; font-weight: 700; letter-spacing: -0.04em;
        font-size: 150px; line-height: 0.95;
      }
      .word b { color: #1A73E8; }
      .tag { font-size: 40px; color: #3c4043; margin-top: 22px; font-weight: 400; }
      .foot { display: flex; align-items: center; gap: 14px; font-size: 24px; color: #80868b; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #c4c7cc; }
    </style>
  </head>
  <body>
    <div class="accent"></div>
    <div class="top">
      <div class="mark">M</div>
      <div class="chip">Micro-frontend demo · GDGoC Bion</div>
    </div>
    <div class="hero">
      <div class="word">Marqet<b>.</b></div>
      <div class="tag">Marketplace perangkat pilihan — dirakit di Bandung.</div>
    </div>
    <div class="foot">
      <span>React + Vue</span><span class="dot"></span>
      <span>Module Federation</span><span class="dot"></span>
      <span>app.gdgocbion.web.id</span>
    </div>
  </body>
</html>
